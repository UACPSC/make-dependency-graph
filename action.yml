name: Makefile dependency graph
description: Generate makegraph.svg for each Makefile in the repo and commit them to a separate branch

inputs:
  branch:
    description: Branch the graphs are committed to
    default: diagrams

runs:
  using: composite
  steps:
    - name: Fetch
      shell: bash
      env:
        TOKEN: ${{ github.token }}
        BRANCH: ${{ inputs.branch }}
      run: |
        git init -q .
        git config http.$GITHUB_SERVER_URL/.extraheader \
          "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

        # latest commit only of both the triggering commit and the graph branch, in one fetch
        if ! git fetch -q --depth=1 --no-tags origin "$GITHUB_SHA" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
          # the graph branch does not exist yet
          git fetch -q --depth=1 --no-tags origin "$GITHUB_SHA"
        fi
        git checkout -q --detach "$GITHUB_SHA"

    - name: Generate graphs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # one makegraph.svg per Makefile, at the same relative path, rendered with the
        # WebAssembly build of Graphviz so nothing has to be installed
        git ls-files '*Makefile' | while read -r makefile; do
          dir=$(dirname "$makefile")
          mkdir -p "$RUNNER_TEMP/makegraph/$dir"
          python3 "$ACTION_PATH/makegraph" "$makefile" --dot |
            node "$ACTION_PATH/render.mjs" "$RUNNER_TEMP/makegraph/$dir/makegraph.svg"
        done

    - name: Commit to graph branch
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        # title of the commit that triggered the run, read before switching branches
        title=$(git log -1 --format=%s "$GITHUB_SHA")

        # switch to the graph branch, creating it empty the first time
        if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null; then
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
        else
          git checkout --orphan "$BRANCH"
          git rm -rfq .
        fi

        cp -R "$RUNNER_TEMP/makegraph/." .
        git add -A -- '*makegraph.svg'
        if git diff --cached --quiet; then
          echo "Graphs already up to date"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
        git commit -m "$title (${GITHUB_SHA::7})"
        git push origin "$BRANCH"
